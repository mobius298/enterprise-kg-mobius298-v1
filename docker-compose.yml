version: '3.8'

services:
  neo4j:
    image: neo4j:5.26
    container_name: kg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: kg-app
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - USE_MOCK_LLM=true
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data: